function setSyncing(on){const d=document.getElementById("sync-dot"),l=document.getElementById("sync-lbl");if(!d)return;d.className="sync-dot"+(on?" syncing":"");l.textContent=on?"A sincronizar...":"Sincronizado";}
async function saveP(p){setSyncing(true);try{await setDoc(doc(db,"progress",p),{comp:COMP[p],updatedAt:Date.now()});}catch(e){console.error(e);}setSyncing(false);}
function subP(p,cb){return onSnapshot(doc(db,"progress",p),s=>{if(s.exists()){COMP[p]=s.data().comp||{};cb();}});}

function badge(t,bg,fg){return`<span class="badge" style="background:${bg};color:${fg}">${t}</span>`;}
function chip(t,bg,fg){return`<span class="chip" style="background:${bg};color:${fg}">${t}</span>`;}

function getStats(p){
  const pl=PLANS[p],c=COMP[p];
  const cnt=pl.weeks.flatMap(w=>w.sessions.map((s,i)=>({wn:w.n,si:i,s}))).filter(x=>x.s.t!=="off");
  const dn=Object.values(c).filter(Boolean).length;
  const dkm=pl.weeks.reduce((t,w)=>t+w.sessions.reduce((wt,s,si)=>wt+(c[`${w.n}-${si}`]&&s.km>0?s.km:0),0),0);
  return{dn,dkm,pct:Math.round(dn/cnt.length*100),total:cnt.length,totalKm:pl.totalKm};
}
function wStats(w,c){
  const cnt=w.sessions.filter(s=>s.t!=="off");
  const dn=cnt.filter(s=>c[`${w.n}-${w.sessions.indexOf(s)}`]).length;
  return{dn,pct:cnt.length?Math.round(dn/cnt.length*100):100,all:cnt.length>0&&dn===cnt.length,total:cnt.length};
}

function renderStats(){
  if(PROFILE==="dual")return;
  const pl=PLANS[PROFILE],{dn,dkm,pct,total,totalKm}=getStats(PROFILE);
  document.getElementById("stats").innerHTML=[{v:`${dn}/${total}`,l:"Sessões feitas"},{v:`${pct}%`,l:"Cumprimento"},{v:`${Math.round(dkm)} km`,l:"Km feitos"},{v:`${Math.round(totalKm-dkm)} km`,l:"Km restantes"}].map(s=>`<div class="stat"><div class="stat-val" style="color:${pl.color}">${s.v}</div><div class="stat-lbl">${s.l}</div></div>`).join("");
  document.getElementById("gfill").style.cssText=`width:${pct}%;background:${pl.color}`;
}

function renderPhasebar(){
  const segs=[["base","27%"],["build","38%"],["peak","14%"],["manut","14%"],["taper","7%"]];
  document.getElementById("phaselegend").innerHTML=segs.map(([p])=>`<span class="pleg"><span class="pleg-dot" style="background:${PC[p].bar}"></span>${PL[p]}</span>`).join("");
  document.getElementById("phasebar").innerHTML=segs.map(([p,w])=>`<div style="width:${w};height:100%;background:${PC[p].bar}"></div>`).join("");
}
function renderFilters(){
  const opts=[["all","Todas"],["base","Base"],["build","Construção"],["peak","Pico"],["manut","Manutenção"],["taper","Taper"],["deload","Deload"],["done","Completas"],["pending","Por fazer"]];
  document.getElementById("filters").innerHTML=opts.map(([v,l])=>`<button class="fpill" style="${FILT===v?'background:#111827;color:#fff;border-color:#111827':''}" onclick="setFilter('${v}')">${l}</button>`).join("");
}
function rfHtml(k){const e=RF[k];if(!e)return"";return`<div class="rf-block">${e.map(x=>`<div class="rf-row"><div><div class="rf-name">${x.n}</div><div class="rf-note">${x.note}</div></div><div class="rf-sets">${x.s}</div></div>`).join("")}</div>`;}

function sHtml(s,si,wn,p){
  const isOff=s.t==="off",done=!!COMP[p][`${wn}-${si}`],tc=TC[s.t]||TC.off,pl=PLANS[p];
  return`<div class="scard" style="${done?`border:2px solid ${pl.color};background:#f0fdf4`:''};${isOff?'opacity:.4;pointer-events:none':''}" id="sc-${p}-${wn}-${si}" style="${done?`border-color:${pl.color}`:""}">
    <div class="shead"><span class="slabel">${s.l}</span>${!isOff?`<button class="chk" style="${done?`background:${pl.color};border-color:${pl.color}`:''}" id="cb-${p}-${wn}-${si}" onclick="toggleS('${p}',${wn},${si})" style="${done?`background:${pl.color};border-color:${pl.color}`:""}">${done?"✓":""}</button>`:""}</div>
    <div class="chips">${chip(TL[s.t],tc.bg,tc.fg)}${s.km>0?chip(s.km+" km","#f1f5f9","#374151"):""}${s.dur&&s.dur!=="—"?chip(s.dur,"#f1f5f9","#6b7280"):""}</div>
    ${s.t==="reforco"?rfHtml(s.rf):(s.desc&&s.desc!=="—"?`<div class="sdesc">${s.desc}</div>`:"")}
    ${s.gel&&s.gel!=="—"?`<span class="gel">${s.gel}</span>`:""}
  </div>`;
}

function wHtml(w,p){
  const pl=PLANS[p],c=COMP[p],{dn,pct,all,total}=wStats(w,c),isOpen=!!EXP[`${p}-${w.n}`],pc=PC[w.phase]||PC.base;
  return`<div class="wcard" style="${all?`border:2px solid ${pl.color}`:''}" id="wc-${p}-${w.n}" style="${all?`border-color:${pl.color}`:""}">
    <div class="wheader" onclick="toggleW('${p}',${w.n})">
      <div class="wleft"><span class="wname">Semana ${w.n}</span>${badge(PL[w.phase],pc.bg,pc.fg)}${w.deload?badge("Deload","#fef3c7","#92400e"):""}${w.ferias?badge("Férias","#dbeafe","#1e40af"):""}${w.prova?badge("Prova","#d1fae5","#065f46"):""}${all?`<span class="badge" style="background:${pl.colorL};color:${pl.color}">✓ Completa</span>`:""}</div>
      <div class="wright">${w.kmTotal>0?`<span class="wkm">${w.kmTotal} km</span>`:""}<span class="wcnt" id="wcnt-${p}-${w.n}">${dn}/${total}</span><span class="wchev" style="${isOpen?'transform:rotate(180deg)':'' }" id="wchev-${p}-${w.n}">▼</span></div>
    </div>
    <div class="wbar"><div class="wbarfill" id="wbf-${p}-${w.n}" style="width:${pct}%;background:${pl.color}"></div></div>
    <div class="wbody" style="${isOpen?'display:block':'display:none'}" id="wb-${p}-${w.n}">
      ${w.note?`<div class="wnote">${w.note}</div>`:""}
      <div class="wdates">${w.dates}</div>
      <div class="sgrid">${w.sessions.map((s,si)=>sHtml(s,si,w.n,p)).join("")}</div>
    </div>
  </div>`;
}

function renderWeeks(){
  const p=PROFILE,pl=PLANS[p],c=COMP[p];
  const vis=pl.weeks.filter(w=>{
    if(FILT==="all")return true;if(FILT==="deload")return w.deload;
    if(FILT==="done"){const ct=w.sessions.filter(s=>s.t!=="off");return ct.length&&ct.every(s=>c[`${w.n}-${w.sessions.indexOf(s)}`]);}
    if(FILT==="pending"){const ct=w.sessions.filter(s=>s.t!=="off");return ct.some(s=>!c[`${w.n}-${w.sessions.indexOf(s)}`]);}
    return w.phase===FILT;
  });
  document.getElementById("weeks").innerHTML=vis.map(w=>wHtml(w,p)).join("");
}

function renderDash(){
  const p=PROFILE,pl=PLANS[p],c=COMP[p];
  const cnt=pl.weeks.flatMap(w=>w.sessions.map((s,i)=>({wn:w.n,si:i,s}))).filter(x=>x.s.t!=="off");
  const maxKm=Math.max(...pl.weeks.map(w=>w.kmTotal),1);
  let html="";
  html+=`<div class="dash-section"><div class="dash-title">Cumprimento por fase</div>`;
  for(const ph of["base","build","peak","manut","taper"]){
    const pw=pl.weeks.filter(w=>w.phase===ph);
    const ps=pw.flatMap(w=>w.sessions.map((s,i)=>({wn:w.n,si:i,s}))).filter(x=>x.s.t!=="off");
    const pd=ps.filter(x=>c[`${x.wn}-${x.si}`]).length;
    const pp=ps.length?Math.round(pd/ps.length*100):0;
    const pkm=pw.reduce((a,w)=>a+w.kmTotal,0);
    const pkd=pw.reduce((a,w)=>a+w.sessions.reduce((b,s,si)=>b+(c[`${w.n}-${si}`]&&s.km>0?s.km:0),0),0);
    const pc=PC[ph];
    html+=`<div class="pbar-row"><div class="pbar-meta"><div style="display:flex;align-items:center;gap:8px">${badge(PL[ph],pc.bg,pc.fg)}<span style="font-size:11px;color:var(--muted)">${pd}/${ps.length} sessões · ${Math.round(pkd)}/${Math.round(pkm)} km</span></div><span style="font-size:12px;font-weight:700;color:${pc.bar}">${pp}%</span></div><div class="pbar"><div class="pbar-fill" style="background:${pc.bar};width:${pp}%"></div></div></div>`;
  }
  html+=`</div>`;
  html+=`<div class="dash-section"><div class="dash-title">Volume semanal — planeado vs feito</div><div class="chart-bars">`;
  pl.weeks.forEach(w=>{
    const kd=w.sessions.reduce((a,s,si)=>a+(c[`${w.n}-${si}`]&&s.km>0?s.km:0),0);
    const bh=Math.max(2,Math.round(w.kmTotal/maxKm*86)),dh=Math.round(kd/maxKm*86),pc=PC[w.phase];
    html+=`<div class="chart-col"><div style="position:relative;width:100%;height:${bh}px"><div style="position:absolute;inset:0;background:#dbeafe;border:1px solid #93c5fd;border-radius:2px 2px 0 0"></div><div style="position:absolute;bottom:0;left:0;right:0;height:${dh}px;background:${pl.color};border-radius:2px 2px 0 0;opacity:.85"></div></div><div class="chart-lbl">${w.n}</div></div>`;
  });
  html+=`</div><div style="display:flex;gap:12px;margin-top:8px"><span style="font-size:10px;display:flex;align-items:center;gap:4px;color:var(--muted)"><span style="width:10px;height:10px;background:#dbeafe;border:1px solid #93c5fd;border-radius:2px;display:inline-block"></span>Planeado</span><span style="font-size:10px;display:flex;align-items:center;gap:4px;color:var(--muted)"><span style="width:10px;height:10px;border-radius:2px;display:inline-block;background:${pl.color};opacity:.85"></span>Feito</span></div></div>`;
  html+=`<div class="dash-section"><div class="dash-title">Sessões por tipo</div><div class="type-grid">`;
  for(const tp of["int","easy","tempo","long","reforco"]){
    const ts=cnt.filter(x=>x.s.t===tp),td=ts.filter(x=>c[`${x.wn}-${x.si}`]).length,tp2=ts.length?Math.round(td/ts.length*100):0,tc=TC[tp];
    html+=`<div class="type-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">${chip(TL[tp],tc.bg,tc.fg)}<span style="font-size:12px;font-weight:700">${tp2}%</span></div><div style="font-size:11px;color:var(--muted);margin-bottom:5px">${td}/${ts.length}</div><div class="tbar"><div class="tbar-fill" style="background:${tc.fg};width:${tp2}%"></div></div></div>`;
  }
  html+=`</div></div>`;
  document.getElementById("dash-view").innerHTML=html;
}

function renderDual(){
  const pv=PLANS.vasco,pa=PLANS.ana,sv=getStats("vasco"),sa=getStats("ana");
  let html=`<div class="dash-section"><div class="dash-title">Comparação directa</div>`;
  [{l:"Sessões feitas",vv:`${sv.dn}/${sv.total}`,av:`${sa.dn}/${sa.total}`,vn:sv.dn/sv.total,an:sa.dn/sa.total},{l:"Km feitos",vv:`${Math.round(sv.dkm)} km`,av:`${Math.round(sa.dkm)} km`,vn:sv.dkm/sv.totalKm,an:sa.dkm/sa.totalKm},{l:"% cumprimento",vv:`${sv.pct}%`,av:`${sa.pct}%`,vn:sv.pct/100,an:sa.pct/100}].forEach(m=>{
    html+=`<div style="margin-bottom:14px"><div style="font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">${m.l}</div><div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center"><div><div style="font-size:14px;font-weight:700;color:${pv.color};margin-bottom:3px">${m.vv}</div><div style="height:6px;border-radius:3px;background:var(--border);overflow:hidden"><div style="height:100%;background:${pv.color};width:${Math.round(m.vn*100)}%;border-radius:3px"></div></div></div><div style="font-size:10px;color:var(--muted);text-align:center;font-weight:700">VS</div><div><div style="font-size:14px;font-weight:700;color:${pa.color};margin-bottom:3px;text-align:right">${m.av}</div><div style="height:6px;border-radius:3px;background:var(--border);overflow:hidden"><div style="height:100%;background:${pa.color};width:${Math.round(m.an*100)}%;border-radius:3px;float:right"></div></div></div></div></div>`;
  });
  html+=`</div><div class="dash-section"><div class="dash-title">Cumprimento por fase</div>`;
  html+=`<div style="display:grid;grid-template-columns:80px 1fr 30px 1fr;gap:6px;margin-bottom:8px;align-items:center"><div></div><div style="font-size:11px;font-weight:700;color:${pv.color};text-align:center">Vasco</div><div></div><div style="font-size:11px;font-weight:700;color:${pa.color};text-align:center">Ana</div></div>`;
  for(const ph of["base","build","peak","manut","taper"]){
    const vw=pv.weeks.filter(w=>w.phase===ph),aw=pa.weeks.filter(w=>w.phase===ph);
    const vs=vw.flatMap(w=>w.sessions.map((s,i)=>({wn:w.n,si:i,s}))).filter(x=>x.s.t!=="off");
    const as=aw.flatMap(w=>w.sessions.map((s,i)=>({wn:w.n,si:i,s}))).filter(x=>x.s.t!=="off");
    const vd=vs.filter(x=>COMP.vasco[`${x.wn}-${x.si}`]).length,ad=as.filter(x=>COMP.ana[`${x.wn}-${x.si}`]).length;
    const vp=vs.length?Math.round(vd/vs.length*100):0,ap=as.length?Math.round(ad/as.length*100):0,pc=PC[ph];
    html+=`<div style="display:grid;grid-template-columns:80px 1fr 30px 1fr;gap:6px;align-items:center;margin-bottom:8px">${badge(PL[ph],pc.bg,pc.fg)}<div><div style="height:7px;border-radius:4px;background:var(--border);overflow:hidden"><div style="height:100%;background:${pv.color};width:${vp}%;border-radius:4px"></div></div><div style="font-size:10px;color:var(--muted);margin-top:2px">${vp}% (${vd}/${vs.length})</div></div><div style="font-size:10px;color:var(--subtle);text-align:center">vs</div><div><div style="height:7px;border-radius:4px;background:var(--border);overflow:hidden"><div style="height:100%;background:${pa.color};width:${ap}%;border-radius:4px"></div></div><div style="font-size:10px;color:var(--muted);margin-top:2px">${ap}% (${ad}/${as.length})</div></div></div>`;
  }
  html+=`</div>`;
  const mK=Math.max(...pv.weeks.map(w=>w.kmTotal),...pa.weeks.map(w=>w.kmTotal),1);
  html+=`<div class="dash-section"><div class="dash-title">Km feitos por semana</div><div class="chart-bars">`;
  for(let i=0;i<29;i++){
    const wv=pv.weeks[i],wa=pa.weeks[i];if(!wv||!wa)continue;
    const kvd=wv.sessions.reduce((a,s,si)=>a+(COMP.vasco[`${wv.n}-${si}`]&&s.km>0?s.km:0),0);
    const kad=wa.sessions.reduce((a,s,si)=>a+(COMP.ana[`${wa.n}-${si}`]&&s.km>0?s.km:0),0);
    const bhv=Math.max(2,Math.round(wv.kmTotal/mK*86)),bhd=Math.max(2,Math.round(wa.kmTotal/mK*86));
    const dv=Math.round(kvd/mK*86),da=Math.round(kad/mK*86);
    html+=`<div class="chart-col" style="gap:1px"><div style="display:flex;gap:1px;align-items:flex-end;height:86px"><div style="flex:1;position:relative;height:${bhv}px"><div style="position:absolute;inset:0;background:#dbeafe;border:1px solid #93c5fd;border-radius:2px 2px 0 0"></div><div style="position:absolute;bottom:0;left:0;right:0;height:${dv}px;background:${pv.color};border-radius:2px 2px 0 0;opacity:.85"></div></div><div style="flex:1;position:relative;height:${bhd}px"><div style="position:absolute;inset:0;background:#fce7f3;border:1px solid #f9a8d4;border-radius:2px 2px 0 0"></div><div style="position:absolute;bottom:0;left:0;right:0;height:${da}px;background:${pa.color};border-radius:2px 2px 0 0;opacity:.85"></div></div></div><div class="chart-lbl">${i+1}</div></div>`;
  }
  html+=`</div><div style="display:flex;gap:12px;margin-top:8px"><span style="font-size:10px;display:flex;align-items:center;gap:4px;color:var(--muted)"><span style="width:10px;height:10px;background:${pv.color};border-radius:2px;display:inline-block;opacity:.85"></span>Vasco</span><span style="font-size:10px;display:flex;align-items:center;gap:4px;color:var(--muted)"><span style="width:10px;height:10px;background:${pa.color};border-radius:2px;display:inline-block;opacity:.85"></span>Ana</span></div></div>`;
  document.getElementById("dual-view").innerHTML=html;
}

window.toggleS=async function(p,wn,si){
  const k=`${wn}-${si}`;COMP[p][k]=!COMP[p][k];await saveP(p);
  const done=COMP[p][k],pl=PLANS[p],w=pl.weeks.find(x=>x.n===wn);
  const sc=document.getElementById(`sc-${p}-${wn}-${si}`),cb=document.getElementById(`cb-${p}-${wn}-${si}`);
  if(sc){sc.className="scard"+(done?" done":"")+(w.sessions[si].t==="off"?" off":"");sc.style.borderColor=done?pl.color:"";}
  if(cb){cb.className="chk"+(done?" done":"");cb.textContent=done?"✓":"";cb.style.background=done?pl.color:"";cb.style.borderColor=done?pl.color:"";}
  const{dn,pct,all,total}=wStats(w,COMP[p]);
  const wbf=document.getElementById(`wbf-${p}-${wn}`),wcnt=document.getElementById(`wcnt-${p}-${wn}`),wc=document.getElementById(`wc-${p}-${wn}`);
  if(wbf){wbf.style.width=pct+"%";wbf.style.background=pl.color;}
  if(wcnt)wcnt.textContent=`${dn}/${total}`;
  if(wc){wc.className="wcard"+(all?" complete":"");wc.style.borderColor=all?pl.color:"";const wh=wc.querySelector(".wheader");if(wh)wh.style.background=all?pl.colorL:"var(--surface2)";const eb=wc.querySelector(".complete-badge");if(all&&!eb){const b=document.createElement("span");b.className="badge complete-badge";b.style.cssText=`background:${pl.colorL};color:${pl.color}`;b.textContent="✓ Completa";wc.querySelector(".wleft").appendChild(b);}else if(!all&&eb)eb.remove();}
  renderStats();
};
window.toggleW=function(p,n){const k=`${p}-${n}`;EXP[k]=!EXP[k];const b=document.getElementById(`wb-${p}-${n}`),c=document.getElementById(`wchev-${p}-${n}`);if(b)b.classList.toggle("open",!!EXP[k]);if(c)c.classList.toggle("open",!!EXP[k]);};
window.setFilter=function(f){FILT=f;renderFilters();renderWeeks();};
window.switchTab=function(t){
  TAB=t;
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(x=>{if(x.dataset.tab===t)x.classList.add("active");});
  ["plan-view","dash-view","dual-view"].forEach(id=>document.getElementById(id).classList.add("hidden"));
  if(t==="plan"){document.getElementById("plan-view").classList.remove("hidden");renderWeeks();}
  if(t==="dash"){document.getElementById("dash-view").classList.remove("hidden");renderDash();}
  if(t==="dual"){document.getElementById("dual-view").classList.remove("hidden");renderDual();}
};

window.selectProfile=async function(p){
  PROFILE=p;FILT="all";TAB="plan";
  document.getElementById("profile-screen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  if(unsubV){unsubV();unsubV=null;}if(unsubA){unsubA();unsubA=null;}
  const pl=p!=="dual"?PLANS[p]:null;
  const dot=document.getElementById("user-dot"),nm=document.getElementById("user-name"),pill=document.getElementById("user-pill");
  if(p!=="dual"){dot.style.background=pl.color;dot.textContent=pl.name[0];nm.textContent=pl.name;pill.style.borderColor=pl.color;}
  else{dot.style.background="#374151";dot.textContent="⚡";nm.textContent="Vasco & Ana";pill.style.borderColor="";}
  const statsEl=document.getElementById("stats"),gbarEl=document.getElementById("gbar-wrap");
  if(p==="dual"){statsEl.classList.add("hidden");gbarEl.classList.add("hidden");}else{statsEl.classList.remove("hidden");gbarEl.classList.remove("hidden");}
  const tabs=p==="dual"?
    `<button class="tab active" data-tab="dual" onclick="switchTab('dual')">Vasco vs Ana</button>`:
    `<button class="tab active" data-tab="plan" onclick="switchTab('plan')">Plano</button><button class="tab" data-tab="dash" onclick="switchTab('dash')">Dashboard</button><button class="tab" data-tab="dual" onclick="switchTab('dual')">Vasco vs Ana</button>`;
  document.getElementById("tabs").innerHTML=tabs;
  ["plan-view","dash-view","dual-view"].forEach(id=>document.getElementById(id).classList.add("hidden"));
  if(p==="dual"){document.getElementById("dual-view").classList.remove("hidden");TAB="dual";}
  else{document.getElementById("plan-view").classList.remove("hidden");renderPhasebar();renderFilters();}
  const refresh=()=>{renderStats();if(TAB==="plan")renderWeeks();if(TAB==="dash")renderDash();if(TAB==="dual")renderDual();};
  unsubV=subP("vasco",refresh);unsubA=subP("ana",refresh);
  renderStats();if(p!=="dual")renderWeeks();else renderDual();
};
window.goProfile=function(){if(unsubV){unsubV();unsubV=null;}if(unsubA){unsubA();unsubA=null;}document.getElementById("app").classList.add("hidden");document.getElementById("profile-screen").classList.remove("hidden");};

async function init(){
  try{const[sv,sa]=await Promise.all([getDoc(doc(db,"progress","vasco")),getDoc(doc(db,"progress","ana"))]);if(sv.exists())COMP.vasco=sv.data().comp||{};if(sa.exists())COMP.ana=sa.data().comp||{};}catch(e){console.error(e);}
  document.getElementById("loading").classList.add("hidden");
  document.getElementById("profile-screen").classList.remove("hidden");
}
init();
</script>
